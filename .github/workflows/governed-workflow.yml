name: governed-workflow
on: [push, pull_request]
jobs:
 verify:
  runs-on: ubuntu-latest
  services:
   postgres:
    image: postgres:16
    env: { POSTGRES_PASSWORD: test, POSTGRES_DB: company_test }
    ports: ['5432:5432']
    options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
  env: { DATABASE_URL: 'postgresql://postgres:test@127.0.0.1:5432/company_test', TEST_DATABASE_URL: 'postgresql://postgres:test@127.0.0.1:5432/company_test', JWT_SECRET: 'test-only-secret-with-at-least-32-characters', JWT_ISSUER: company-os-ci, JWT_AUDIENCE: company-os-api-ci }
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
   - run: npm ci
     working-directory: backend
   - run: npm ci
     working-directory: frontend
   - run: ALLOW_SCHEMA_MIGRATION=1 ./start.sh migrate
   - run: ALLOW_SCHEMA_MIGRATION=1 ./start.sh migrate
   - run: ./start.sh check
   - run: npm audit --omit=dev --audit-level=high
     working-directory: backend
   - run: npm audit --omit=dev --audit-level=high
     working-directory: frontend
